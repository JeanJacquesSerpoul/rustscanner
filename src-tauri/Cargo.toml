[package]
name = "rustscanner"
description = "Application de numérisation de documents (SANE, WIA) inspirée de Skanpage — Rust, Tauri et Leptos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustscanner_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rustscanner-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["sync", "rt"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg", "tiff", "webp"] }
flate2 = "1"
dirs = "6"
thiserror = "2"
log = "0.4"
chrono = "0.4"
libc = "0.2"

# Linux, macOS : SANE, chargée à l'exécution
[target.'cfg(not(windows))'.dependencies]
libloading = "0.8"

# Windows : scanners par WIA 2.0, impression par GDI
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_ImageAcquisition",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# requis par `#[implement]` (rappel de transfert WIA)
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
