[package]
name = "rustscanner"
description = "Application de numérisation de documents (SANE) inspirée de Skanpage — Rust, Tauri et Leptos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustscanner_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rustscanner-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["sync", "rt"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
flate2 = "1"
dirs = "6"
thiserror = "2"
log = "0.4"
chrono = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
