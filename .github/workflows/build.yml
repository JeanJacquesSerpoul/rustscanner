name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04 # glibc ancienne : paquets compatibles avec plus de distributions
            rust-targets: wasm32-unknown-unknown
            args: ""
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            rust-targets: wasm32-unknown-unknown
            args: ""
            files: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
              target/release/rustscanner.exe
          - name: macOS
            os: macos-latest
            # binaire universel : Apple Silicon et Intel
            rust-targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            files: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      - name: Construction
        run: cargo tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: rustscanner-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
